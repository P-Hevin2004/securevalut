{% extends 'files/base.html' %}

{% block title %}Create Group - FileShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="fas fa-plus-circle"></i> Create New Group
                </h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-layer-group"></i> Group Name *
                        </label>
                        <input type="text" class="form-control" id="name" name="name" 
                               placeholder="Enter group name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="fas fa-align-left"></i> Description
                        </label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="3" placeholder="Enter group description (optional)"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="members" class="form-label">
                            <i class="fas fa-users"></i> Add Members (Hold Ctrl/Cmd to select multiple)
                        </label>
                        <select class="form-control" id="members" name="members" multiple size="8">
                            {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }} ({{ user.email }})</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Select users to add to this group. You can add more members later.</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'groups_list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Create Group
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
